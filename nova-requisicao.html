<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>EBJC Equipamentos | Nova Requisição</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><i class="fa-solid fa-microchip"></i> EBJC EQUIPAMENTOS</div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li><a href="nova-requisicao.html" class="active"><i class="fa-solid fa-plus-circle"></i> Nova Requisição</a></li>
        <li><a href="pedidos.html"><i class="fa-solid fa-list-check"></i> Consultar Pedidos</a></li>
        <li><a href="entregas.html"><i class="fa-solid fa-hand-holding-box"></i> Entregas</a></li>
        <li><a href="devolucoes.html"><i class="fa-solid fa-rotate-left"></i> Devoluções</a></li>
        <li><a href="inventario.html"><i class="fa-solid fa-boxes-stacked"></i> Inventário</a></li>
      </ul>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h2>Nova Requisição de Equipamento</h2>
    </header>
    <div class="container">
      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <form id="formRequisicao">
          <label>Nome Completo do Aluno</label>
          <input type="text" id="nomeAluno" required readonly>

          <label>Email Institucional Microsoft</label>
          <input type="email" id="emailAluno" required readonly>

          <label>Turma</label>
          <input type="text" id="turmaAluno" value="Turma Cyber / Técnico de Gestão e Programação de Sistemas Informáticos" required readonly>

          <label>Equipamento Pretendido</label>
          <select id="equipamento" required>
            <option value="">Selecionar equipamento...</option>
            <option value="Computador Portátil">Computador Portátil</option>
            <option value="Computador de Secretária">Computador de Secretária</option>
            <option value="Monitor">Monitor</option>
            <option value="Teclado / Rato">Teclado / Rato</option>
            <option value="Auscultadores">Auscultadores</option>
            <option value="Cabo HDMI / Adaptador">Cabo HDMI / Adaptador</option>
            <option value="Projetor">Projetor</option>
          </select>

          <label>Quantidade</label>
          <input type="number" id="quantidade" min="1" max="3" value="1" required>

          <div style="display: flex; gap: 15px;">
            <div style="flex:1;">
              <label>Data Prevista para Levantamento</label>
              <input type="date" id="dataLevantamento" required>
            </div>
            <div style="flex:1;">
              <label>Data Prevista para Devolução</label>
              <input type="date" id="dataDevolucao" required>
            </div>
          </div>

          <label>Finalidade da Requisição</label>
          <textarea id="finalidade" rows="3" placeholder="Ex: Projeto PAP / Aulas de Programação Web" required></textarea>

          <label>Observações Adicionais</label>
          <textarea id="observacoes" rows="2" placeholder="Notas opcionais..."></textarea>

          <button type="submit" class="btn" style="width: 100%; margin-top: 20px;"><i class="fa-solid fa-paper-plane"></i> Submeter Pedido</button>
        </form>
      </div>
    </div>
  </main>
  
  
  <script type="module" src="js/app.js"></script>
</body>
</html>
