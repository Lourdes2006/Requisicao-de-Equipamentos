<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d14">
  <title>EBJC Equipamentos | Autenticação</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <main class="login-card">
    <div class="login-logo"><i class="fa-solid fa-microchip"></i></div>
    <div class="login-title">EBJC EQUIPAMENTOS</div>
    <div class="login-subtitle">Portal de Requisição de Equipamentos</div>
    <button class="btn-microsoft" id="btnLoginMicrosoft" type="button">
      <i class="fa-brands fa-microsoft" aria-hidden="true"></i>
      Entrar com conta Microsoft
    </button>
    <p class="login-hint">Utiliza a tua conta institucional @alunos.epbjc.pt</p>
    <div id="errorMessage" role="alert" aria-live="polite"></div>
  </main>
  <script type="module" src="js/microsoft-auth.js"></script>
</body>
</html>
