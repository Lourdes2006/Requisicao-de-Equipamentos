<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EBJC Equipamentos | Autenticação</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-microchip"></i></div>
    <div class="login-title">EBJC EQUIPAMENTOS</div>
    <div class="login-subtitle">Portal de Requisição de Equipamentos</div>
    
    <form id="formLogin" style="display:grid;gap:12px;text-align:left;margin-top:22px"><label for="loginEmail">Email institucional</label><input id="loginEmail" type="email" autocomplete="username" placeholder="nome@escola.pt" required><label for="loginPassword">Palavra-passe</label><input id="loginPassword" type="password" autocomplete="current-password" minlength="6" required><button class="btn-microsoft" id="btnLoginFirebase" type="submit">Entrar com Firebase</button></form>
    <div id="errorMessage"></div>
  </div>

  
  <script type="module" src="js/app.js"></script>
</body>
</html>
