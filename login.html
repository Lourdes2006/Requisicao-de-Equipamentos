
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EBJC Equipamentos | Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102b52, #1769aa);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 18px;
      background: white;
      text-align: center;
      box-shadow: 0 15px 45px #0003;
    }
    .login-logo {
      color: #1769aa;
      font-size: 45px;
      margin-bottom: 15px;
    }
    .login-title {
      color: #17365d;
      font-size: 23px;
      font-weight: bold;
    }
    .login-subtitle {
      color: #68778a;
      margin: 10px 0 28px;
    }
    .btn-microsoft {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-microsoft:hover { background: #10558d; }
    .btn-microsoft:disabled {
      opacity: .65;
      cursor: wait;
    }
    #errorMessage {
      color: #c62828;
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-microchip"></i>
    </div>

    <div class="login-title">EBJC EQUIPAMENTOS</div>
    <div class="login-subtitle">
      Portal de Requisição de Equipamentos
    </div>

    <button class="btn-microsoft" id="btnLoginMicrosoft" type="button">
      <i class="fa-brands fa-microsoft"></i>
      Entrar com Microsoft
    </button>

    <div id="errorMessage" role="alert"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
